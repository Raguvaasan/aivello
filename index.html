<!DOCTYPE html>

    <!--
      Applies the saved theme before first paint.

      This MUST stay inline and MUST stay above the stylesheet. ThemeContext also
      sets these, but it only runs after React mounts, which is after the browser
      has already painted - so dark-mode users saw a white flash on every load.
      Keep this in sync with src/context/ThemeContext.tsx.
    -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                var theme = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
                var resolved = theme === 'system'
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : theme;
                document.documentElement.classList.add(resolved);
                document.documentElement.style.colorScheme = resolved;
            } catch (e) {
                // localStorage can throw in private mode / blocked-cookie contexts.
                // Falling through leaves the light default, which is safe.
            }
        })();
    </script>

    <!-- AdSense site ownership (verification no longer needs the ad script itself). -->
    <meta name="google-adsense-account" content="ca-pub-2807800939240640" />

    <!--
      Google Analytics + AdSense, loaded off the critical path.

      Together they cost ~900ms of main-thread time on a mid-range phone, which was
      most of the landing page's Total Blocking Time. gtag() calls are queued in
      dataLayer immediately, so no events are lost while the scripts load:
        - gtag.js loads when the browser is idle, ~2.5s after the page has loaded;
        - adsbygoogle.js loads on the first user interaction (or after 8s).
    -->
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());
        gtag('config', 'G-HT07LRHYC5');

        (function () {
            function load(src, attrs) {
                var s = document.createElement('script');
                s.async = true;
                s.src = src;
                if (attrs && attrs.crossOrigin) s.crossOrigin = attrs.crossOrigin;
                document.head.appendChild(s);
            }
            var idle = window.requestIdleCallback || function (cb) { return setTimeout(cb, 1500); };
            window.addEventListener('load', function () {
                setTimeout(function () {
                    idle(function () { load('https://www.googletagmanager.com/gtag/js?id=G-HT07LRHYC5'); }, { timeout: 4000 });
                }, 2500);
            });

            var adsLoaded = false;
            var events = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
            function loadAds() {
                if (adsLoaded) return;
                adsLoaded = true;
                events.forEach(function (e) { window.removeEventListener(e, loadAds, { passive: true }); });
                load('https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2807800939240640', { crossOrigin: 'anonymous' });
            }
            events.forEach(function (e) { window.addEventListener(e, loadAds, { passive: true, once: true }); });
            setTimeout(loadAds, 8000);
        })();
    </script>
